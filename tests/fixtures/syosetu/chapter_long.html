<!DOCTYPE html>
<html lang="ja"><head><title>テスト長編 - 第1話</title></head>
<body>
<h1 class="p-novel__title p-novel__title--rensai">第一話　長い道</h1>
<div class="p-novel__body">
  <div class="js-novel-text p-novel__text">
    <p id="L1">空は高く晴れていた。村の人々は朝早くから畑に出て、静かに働いていた。</p>
    <p id="L2">遠くの山には雪が残り、風はまだ冷たかった。少年は古い剣を背負って、長い道を歩き始めた。</p>
    <p id="L3">「どこへ行くのですか」と老人が尋ねると、少年は黙って北の空を指さした。</p>
    <p id="L4">その夜、彼は小さな宿で眠れずに、窓の外の星を数えていた。</p>
    <p id="L5">次の朝、宿の主人は温かいスープを出して、気をつけて行きなさいと言った。</p>
    <p id="L6">少年は深く頭を下げ、また歩き出した。道の先には大きな森が広がっていた。</p>
  </div>
</div>
</body></html>
