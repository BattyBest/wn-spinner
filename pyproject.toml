[project]
name = "wn-spinner"
version = "0.1.0"
description = "Local-first companion that finds webnovels matching your CJK reading level."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "selectolax>=1.0.2",
  "sudachidict-core>=20261015",
  "sudachipy>=0.7.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.scripts]
wn = "wn.cli:app"

[tool.uv]
# Mirrors the frontend's three-day minimumReleaseAge: nothing published after this
# moment is installed. Move it forward deliberately when dependencies change.
exclude-newer = "2026-10-31T00:00:00Z"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
